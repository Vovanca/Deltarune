<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Save Generator</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier Prime', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .save-card {
            border: 4px solid #fff;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            background-color: #000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .header {
            color: #ffff00;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section {
            margin-bottom: 15px;
            font-size: 18px;
            line-height: 1.5;
        }

        .label {
            color: #ff00ff;
            font-weight: bold;
        }

        .value {
            color: #ffffff;
        }

        .inventory-list {
            margin: 5px 0 0 20px;
            padding: 0;
            list-style-type: square;
            color: #00ffff;
        }

        .btn {
            background-color: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-family: 'Courier Prime', 'Courier New', monospace;
            font-size: 18px;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #fff;
            color: #000;
            font-weight: bold;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="save-card">
        <div class="header">--- DELTARUNE SAVE ---</div>
        
        <div class="section">
            <span class="label">Место:</span> 
            <span id="location" class="value">-</span>
        </div>
        
        <div class="section">
            <span class="label">Оружие Крис:</span> 
            <span id="weapon" class="value">-</span>
        </div>
        
        <div class="section">
            <span class="label">Броня:</span> 
            <span id="armor" class="value">-</span>
        </div>
        
        <div class="section">
            <span class="label">Инвентарь:</span>
            <ul id="inventory" class="inventory-list">
                <li>-</li>
            </ul>
        </div>

        <button class="btn" onclick="generateSave()">ГЕНЕРИРОВАТЬ</button>
    </div>

    <script>
        // Данные для генерации (можно дополнять своими предметами)
        const locations = [
            "Castle Town (Город Замка)",
            "Fields (Поля)",
            "Scarlet Forest (Алый Лес)",
            "Card Castle (Замок Карт)",
            "Cyber Field (Кибер-поле)",
            "Cyber City (Кибер-город)",
            "Queen's Mansion (Особняк Королевы)",
            "Hometown - Library (Библиотека)"
        ];

        const weapons = [
            "Wood Blade (Деревянный клинок)",
            "Mane Ax (Топор Гривы)",
            "Red Scarf (Красный шарф)",
            "Bounce Blade (Пружинящий клинок)",
            "Devilsknife (Дьявольский нож)",
            "Auto Sci (Авто-ножницы)",
            "Mecha Saber (Меха-сабля)",
            "PuppetScarf (Шарф марионетки)"
        ];

        const armors = [
            "Amber Card (Янтарная карта)",
            "Dice Brace (Кубический браслет)",
            "White Ribbon (Белая лента)",
            "IronShackle (Железные кандалы)",
            "Jevilstail (Хвост Джевила)",
            "Chain Mail (Кольчуга)",
            "Brave Axle (Ось храбрости)",
            "Dealmaker (Заключитель сделок)"
        ];

        const items = [
            "Dark Candy", "Choco Diamond", "HeartsDonut", "Lancer Cookie",
            "Spin Cake", "ReviveMint", "Top Chef Cake", "GlowWrist",
            "Manual", "Clubs Sandwich", "S.Potion", "CD Bag",
            "Light Candy", "ButtsPie", "Spaghetti", "Tea (Kris)",
            "Tea (Susie)", "Tea (Ralsei)", "Tea (Noelle)", "TensionMax"
        ];

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateSave() {
            // Рандомим локацию, оружие и броню
            document.getElementById('location').innerText = getRandomElement(locations);
            document.getElementById('weapon').innerText = getRandomElement(weapons);
            document.getElementById('armor').innerText = getRandomElement(armors);

            // Рандомим инвентарь (случайное количество предметов от 2 до 5)
            const inventoryList = document.getElementById('inventory');
            inventoryList.innerHTML = ''; // Очищаем старый список
            
            const itemCount = Math.floor(Math.random() * 4) + 2; // от 2 до 5 предметов
            
            for (let i = 0; i < itemCount; i++) {
                const li = document.createElement('li');
                li.innerText = getRandomElement(items);
                inventoryList.appendChild(li);
            }
        }

        // Генерируем первый вариант сразу при загрузке страницы
        window.onload = generateSave;
    </script>
</body>
</html>
